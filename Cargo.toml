[workspace]
resolver = "2"
members = [
    "crates/metaschemars-model",
    "crates/metaschemars-yaml",
    "crates/metaschemars",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/aj-stein/metaschemars"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
